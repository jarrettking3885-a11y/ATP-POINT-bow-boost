name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle files
        working-directory: ./bowboost-helper-fixed
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties

      - name: Build
        working-directory: ./bowboost-helper-fixed
        run: gradle build --stacktrace
